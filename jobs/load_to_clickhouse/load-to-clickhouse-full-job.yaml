apiVersion: batch/v1
kind: Job
metadata:
  name: load-to-clickhouse-full
  namespace: bigdata
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: load-to-clickhouse-full
    spec:
      restartPolicy: Never
      containers:
        - name: load-to-clickhouse-full
          image: load-to-clickhouse-full:latest
          imagePullPolicy: IfNotPresent
          args: ["--layer", "gold"]
          env:
            - name: MINIO_ENDPOINT
              value: "minio:9000"
            - name: MINIO_ACCESS_KEY
              value: "minioadmin"
            - name: MINIO_SECRET_KEY
              value: "minioadmin123"
            - name: MINIO_BUCKET
              value: "air-quality-data"
            - name: CLICKHOUSE_HOST
              value: "clickhouse"
            - name: CLICKHOUSE_PORT
              value: "8123"
            - name: CLICKHOUSE_DATABASE
              value: "air_quality"
            - name: CLICKHOUSE_USER
              value: "default"
            - name: CLICKHOUSE_PASSWORD
              value: "default123"
