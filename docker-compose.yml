services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - bigdata-network

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - bigdata-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  # ClickHouse
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    hostname: clickhouse
    container_name: clickhouse
    ports:
      - '8123:8123' # HTTP interface
      - '9002:9000' # Native protocol (mapped to 9002 to avoid conflict with MinIO)
    environment:
      CLICKHOUSE_DB: air_quality
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: 'default123'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - bigdata-network

  # Spark Batch Processing Job (for ML Training)
  # Pipeline: Bronze → Silver → Gold (Bronze is written by batch/backfill/backfill_to_bronze.py)
  spark-batch:
    build:
      context: .
      dockerfile: batch/spark/Dockerfile
    container_name: spark-batch
    hostname: spark-batch
    depends_on:
      - minio
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET=air-quality-data
      - PYSPARK_SUBMIT_ARGS=--packages org.apache.hadoop:hadoop-aws:3.3.4 pyspark-shell
    volumes:
      - ./batch/spark:/opt/spark/work-dir
    networks:
      - bigdata-network
    # Don't auto-start - run manually for batch processing
    restart: 'no'

networks:
  bigdata-network:
    driver: bridge

volumes:
  minio-data:
  clickhouse-data:
  redis-data:
