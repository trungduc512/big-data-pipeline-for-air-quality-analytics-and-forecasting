apiVersion: v1
kind: ServiceAccount
metadata:
  name: historical-workflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: historical-workflow-executor
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: historical-workflow-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: historical-workflow-executor
subjects:
  - kind: ServiceAccount
    name: historical-workflow
