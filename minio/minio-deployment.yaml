apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio

  template:
    metadata:
      labels:
        app: minio

    spec:
      containers:
        - name: minio
          image: minio/minio:latest

          args:
            - server
            - /data
            - --console-address
            - ":9001"

          ports:
            - containerPort: 9000
            - containerPort: 9001

          env:
            - name: MINIO_ROOT_USER
              value: "minioadmin"

            - name: MINIO_ROOT_PASSWORD
              value: "minioadmin123"

          volumeMounts:
            - name: minio-storage
              mountPath: /data

          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 20

      volumes:
        - name: minio-storage
          persistentVolumeClaim:
            claimName: minio-pvc