apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:latest
          ports:
            - containerPort: 8123
            - containerPort: 9000
          env:
            - name: CLICKHOUSE_DB
              value: air_quality

            - name: CLICKHOUSE_USER
              value: default

            - name: CLICKHOUSE_PASSWORD
              value: default123

          volumeMounts:
            - name: clickhouse-storage
              mountPath: /var/lib/clickhouse
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d

          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"

      volumes:
        - name: clickhouse-storage
          persistentVolumeClaim:
            claimName: clickhouse-pvc

        - name: init-script
          configMap:
            name: clickhouse-init-script
